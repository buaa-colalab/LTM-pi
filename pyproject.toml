[project]
name = "ltm-pi-robomme"
version = "1.1.0"
description = "Standalone LTM-Pi training and inference for RoboMME with DreamDojo memory"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "av==17.0.0",
    "augmax==0.4.1",
    "dm-tree==0.1.9",
    "einops==0.8.1",
    "equinox==0.12.2",
    "etils==1.12.2",
    "flatbuffers==25.2.10",
    "flax==0.10.2",
    "filelock==3.18.0",
    "fsspec==2025.3.0",
    "gym-aloha==0.1.1",
    "imageio==2.37.0",
    "jax[cuda12]==0.5.3",
    "jaxtyping==0.2.36",
    "lerobot @ git+https://github.com/huggingface/lerobot@0cf864870cf29f4738d3ade893e6fd13fbd7cdb5",
    "ml-collections==1.0.0",
    "msgpack==1.1.0",
    "numpy==1.26.4",
    "numpydantic==1.6.9",
    "opencv-python-headless==4.11.0.86",
    "optax==0.2.4",
    "orbax-checkpoint==0.11.13",
    "pillow==11.2.1",
    "sentencepiece==0.2.0",
    "torch==2.7.1",
    "tqdm-loggable==0.2",
    "tyro==0.9.22",
    "wandb==0.19.11",
    "websockets==15.0.1",
    "beartype==0.19.0",
    "chex==0.1.90",
    "treescope==0.1.9",
    "transformers==4.53.2",
    "rich==14.0.0",
    "polars==1.30.0",
]

[project.optional-dependencies]
dev = ["ruff==0.8.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/openpi", "src/openpi_client"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
